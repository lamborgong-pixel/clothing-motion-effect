<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>服饰衣架 — 网站嵌入示例</title>
  <style>
    body{margin:0;padding:24px;background:#fff;color:#292b27;font:14px Arial,sans-serif;}
    main{max-width:1200px;margin:auto;}h1{font-size:20px;font-weight:500;margin:0 0 20px;}
    iframe{display:block;width:100%;height:680px;border:0;}
    @media(max-width:700px){body{padding:12px;}iframe{height:640px;}}
  </style>
</head>
<body>
  <main>
    <h1>服饰展示</h1>
    <!-- 将 src 改成你上传组件的地址，服饰仍在 clothes.config.js 中配置。 -->
    <iframe src="./index.html?embed=1" title="服饰衣架展示"></iframe>
  </main>
</body>
</html>
